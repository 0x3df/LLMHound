# Example configuration. Copy to llmhound.yaml and replace the deployment/vantage
# keys and inputs. Strict: unknown keys are rejected.
scope: example-deployment
vantage_key: scanner-network-a

# IP literals, ASCII FQDNs, and canonical CIDRs. Names are not resolved.
targets:
  - ai.example.test
cidrs:
  - 192.0.2.0/30
# Paths in YAML are relative to this configuration file's directory.
targets_files: []
exclude:
  - 192.0.2.0/31
exclude_files: []

bounds:
  # Raw expansion includes duplicates, before exclusions. Hard cap: 65536.
  max_targets: 4096
  concurrency: 16
  per_host_rate: 2
  connect_timeout: 3s
  response_timeout: 10s
  max_response_bytes: 1048576
  max_pages: 100
  max_items: 10000
  max_redirects: 0

insecure: false
user_agent: "LLMHound/dev (+operator@example.test)"

# Bounded, anonymous, read-only content-tier collection (written to <prefix>.content.jsonl,
# mode 0600, never shipped to BloodHound). Enabled by default; disable globally or per surface.
content:
  enabled: true
  max_item_bytes: 262144
  max_items_per_resource: 10
  max_service_bytes: 5242880
  max_sample_points: 5
  surfaces: {}

# High-precision secret detectors over content bodies. A match is replaced by
# [secret:<type>] in .content.jsonl and flagged on the graph as a boolean; the
# value is never stored. All detectors are on; set one to false to disable it.
secrets:
  detectors: {}

# Attribution belongs to the normalization program. Point mapping_file at its
# asset mapping (target to existing BloodHound objectid and kind). Without one,
# every service attaches to a NetworkEndpoint for the normalizer to attribute.
correlation:
  mapping_file: ""
