# M1: offline input validation only. No collectors, DNS correlation, or upload.
# Copy to llmhound.yaml and replace the deployment/vantage keys and inputs.
scope: example-deployment
vantage_key: scanner-network-a

# IP literals, ASCII FQDNs, and canonical CIDRs. Names are not resolved.
targets:
  - ai.example.test
cidrs:
  - 192.0.2.0/30
# Paths in YAML are relative to this configuration file's directory.
targets_files: []
exclude:
  - 192.0.2.0/31
exclude_files: []

bounds:
  # Raw expansion includes duplicates, before exclusions. Hard cap: 65536.
  max_targets: 4096
  # Remaining bounds are validated but reserved for future collectors.
  concurrency: 16
  per_host_rate: 2
  connect_timeout: 3s
  response_timeout: 10s
  max_response_bytes: 1048576
  max_pages: 100
  max_items: 10000
  max_redirects: 0

# Reserved collection policy; no TLS or HTTP operations in M1.
insecure: false
user_agent: "LLMHound/dev (+operator@example.test)"
opt_ins:
  resource_content: false
  prompts: false
  configuration_content: false
  workspace_content: false

# Stored/validated policy only; no mapping reads, DNS, or CE calls in M1.
correlation:
  mapping_file: ""
  ad_domain_suffixes: []
  reverse_dns: false
  ce_lookup: false
