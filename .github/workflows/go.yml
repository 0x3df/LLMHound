name: Go CI

on:
  pull_request:
  # Direct pushes to the integration and release branches must be validated
  # too; a PR-only trigger let unreviewed commits reach QA without CI.
  push:
    branches: [QA, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module:
    name: Detect Go module (bootstrap only if absent)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.module.outputs.present }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Detect root module
        id: module
        shell: bash
        run: |
          if [[ -f go.mod ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'Root go.mod found; Go validation is required.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "$(git ls-files -- '*.go' '**/go.mod')" ]]; then
            echo '::error::Go files exist but root go.mod is missing; refusing bootstrap-only validation.'
            exit 1
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Bootstrap only: no root go.mod or tracked Go files. Go validation is skipped, not passed. This is not product CI evidence.' >> "$GITHUB_STEP_SUMMARY"
          fi

  go:
    name: Go format, race tests, vet, build
    needs: module
    if: needs.module.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(git ls-files -z -- '*.go' | xargs -0 -r gofmt -l)
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            echo '::error::Run gofmt on the files listed above.'
            exit 1
          fi
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Build without cgo
        run: CGO_ENABLED=0 go build ./...
      - name: Cross-build and vet for Windows (production collection host)
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
          GOOS=windows GOARCH=amd64 go vet ./...
      - name: Staticcheck (pinned)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...
          GOOS=windows "$(go env GOPATH)/bin/staticcheck" ./...
      - name: Govulncheck (pinned)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          "$(go env GOPATH)/bin/govulncheck" ./...
          GOOS=windows "$(go env GOPATH)/bin/govulncheck" ./...

  windows:
    name: Windows tests (production platform)
    needs: module
    if: needs.module.outputs.present == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test ./...
